<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新手健身紀錄 PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  <style>
    :root {
      --primary: #4A90E2;
      --bg: #F4F6F9;
      --card-bg: #FFFFFF;
      --text: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #666;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #DDD;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row .form-group {
      flex: 1;
    }
    button.btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }
    button.btn-submit:active {
      opacity: 0.9;
    }
    .log-item {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--primary);
    }
    .log-detail {
      font-size: 0.95rem;
      color: #555;
    }
    .delete-btn {
      position: absolute;
      right: 10px;
      top: 10px;
      background: none;
      border: none;
      color: #FF4D4F;
      font-size: 1rem;
      cursor: pointer;
      width: auto;
      padding: 2px 6px;
    }
  </style>
</head>
<body>

  <h1>🏋️‍♂️ 新手器械健身紀錄</h1>

  <!-- 新增紀錄表單 -->
  <div class="card">
    <div class="form-group">
      <label for="date">日期</label>
      <input type="date" id="date">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="category">訓練部位</label>
        <select id="category" onchange="updateEquipmentOptions()">
          <option value="胸部">胸部</option>
          <option value="背部">背部</option>
          <option value="腿部">腿部</option>
          <option value="肩部">肩部</option>
          <option value="手臂/核心">手臂/核心</option>
        </select>
      </div>

      <div class="form-group">
        <label for="equipment">器械器材</label>
        <select id="equipment"></select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="weight">重量 (kg)</label>
        <input type="number" id="weight" placeholder="30" step="2.5">
      </div>
      <div class="form-group">
        <label for="reps">次數 (下)</label>
        <input type="number" id="reps" placeholder="12">
      </div>
      <div class="form-group">
        <label for="sets">組數</label>
        <input type="number" id="sets" placeholder="4">
      </div>
    </div>

    <button class="btn-submit" onclick="addLog()">新增訓練紀錄</button>
  </div>

  <!-- 歷史紀錄顯示區 -->
  <h2>📋 歷史紀錄</h2>
  <div id="logList"></div>

  <script>
    // 預設器械式器材選單
    const equipmentData = {
      '胸部': ['座姿胸推機', '蝴蝶機夾胸', '上斜胸推機'],
      '背部': ['滑輪下拉機', '座姿划船機', '高位下拉機'],
      '腿部': ['腿多功能推舉機', '坐姿大腿伸展機', '臥姿大腿彎舉機'],
      '肩部': ['座姿肩推機', '機械飛鳥 (後三角)'],
      '手臂/核心': ['三頭肌下壓機', '二頭肌彎舉機', '機械捲腹機']
    };

    // 初始化日期預設為今天
    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    // 動態更新器材選單
    function updateEquipmentOptions() {
      const category = document.getElementById('category').value;
      const equipmentSelect = document.getElementById('equipment');
      equipmentSelect.innerHTML = '';
      
      equipmentData[category].forEach(item => {
        const option = document.createElement('option');
        option.value = item;
        option.textContent = item;
        equipmentSelect.appendChild(option);
      });
    }

    // 新增紀錄到 localStorage
    function addLog() {
      const date = document.getElementById('date').value;
      const category = document.getElementById('category').value;
      const equipment = document.getElementById('equipment').value;
      const weight = document.getElementById('weight').value;
      const reps = document.getElementById('reps').value;
      const sets = document.getElementById('sets').value;

      if (!weight || !reps || !sets) {
        alert('請填寫完整重量、次數與組數！');
        return;
      }

      const newLog = { id: Date.now(), date, category, equipment, weight, reps, sets };
      const logs = JSON.parse(localStorage.getItem('fitnessLogs') || '[]');
      logs.unshift(newLog); // 最新發布的在最前
      localStorage.setItem('fitnessLogs', JSON.stringify(logs));

      renderLogs();
    }

    // 渲染歷史紀錄
    function renderLogs() {
      const logList = document.getElementById('logList');
      logList.innerHTML = '';
      const logs = JSON.parse(localStorage.getItem('fitnessLogs') || '[]');

      if (logs.length === 0) {
        logList.innerHTML = '<p style="text-align:center; color:#888;">目前還沒有紀錄，開始第一次訓練吧！</p>';
        return;
      }

      logs.forEach(log => {
        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
          <button class="delete-btn" onclick="deleteLog(${log.id})">✕</button>
          <div class="log-header">
            <span>${log.date} - ${log.equipment}</span>
            <span>${log.category}</span>
          </div>
          <div class="log-detail">
            重量：<strong>${log.weight} kg</strong> | 次數：<strong>${log.reps} 下</strong> | 組數：<strong>${log.sets} 組</strong>
          </div>
        `;
        logList.appendChild(item);
      });
    }

    // 刪除單筆紀錄
    function deleteLog(id) {
      let logs = JSON.parse(localStorage.getItem('fitnessLogs') || '[]');
      logs = logs.filter(log => log.id !== id);
      localStorage.setItem('fitnessLogs', JSON.stringify(logs));
      renderLogs();
    }

    // 初始化頁面
    updateEquipmentOptions();
    renderLogs();

    // 註冊 Service Worker (PWA 離線支援)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker 註冊成功！'))
        .catch(err => console.error('SW 註冊失敗:', err));
    }
  </script>
</body>
</html>
